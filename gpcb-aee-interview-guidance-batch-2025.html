<title>GPCB - AEE - INTERVIEW GUIDANCE BATCH 2025 — WebSankul Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --blue:#2E5FDC; --blue-deep:#1E3FA0;
  --red:#E63950; --red-deep:#C22740;
  --ink:#1B2030; --muted:#6B7280;
  --card:#FFFFFF; --line:#ECEEF3;
  --bg1:#F3F6FC; --bg2:#FCEEF1;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif; color:var(--ink);
  background:
    radial-gradient(circle at 12% -10%, rgba(46,95,220,0.10), transparent 45%),
    radial-gradient(circle at 90% 0%, rgba(230,57,80,0.10), transparent 40%),
    linear-gradient(180deg, var(--bg1) 0%, #FFFFFF 30%, var(--bg2) 100%);
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding: 40px 16px;
}
.card{
  width:100%; max-width:480px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow: 0 20px 60px rgba(30,40,60,0.10), 0 4px 14px rgba(30,40,60,0.05);
  padding: 34px 30px 28px;
}
.logo-badge{
  width:78px; height:78px; margin:0 auto 14px;
  border-radius:20px; background:#fff;
  box-shadow: 0 8px 22px rgba(30,40,60,0.10);
  display:flex; align-items:center; justify-content:center; padding:9px;
}
.logo-badge img{ width:100%; height:100%; object-fit:contain; }
.brand-title{
  text-align:center;
  font-family:'Sora',sans-serif; font-weight:800; font-size:26px;
  letter-spacing:-0.02em; color:var(--ink);
}
.brand-title .accent{ color:var(--red); }
.brand-sub{
  text-align:center; margin-top:6px; font-size:12px; font-weight:700;
  letter-spacing:0.14em; text-transform:uppercase; color:var(--muted);
}
.brand-sub b{ color:var(--blue); }
.divider{
  height:1px; margin:22px 0 18px;
  background:linear-gradient(90deg, transparent, var(--line) 15%, var(--line) 85%, transparent);
}
.eyebrow{
  text-align:center; font-size:11px; font-weight:700; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--blue); margin-bottom:8px;
}
.course-title{
  text-align:center; font-family:'Sora',sans-serif; font-weight:700;
  font-size:19px; line-height:1.4; color:var(--ink); margin-bottom:26px;
}
.link-btn{
  display:flex; align-items:center; gap:12px;
  padding:15px 16px; border-radius:16px; text-decoration:none;
  font-family:'Inter',sans-serif; color:#fff; margin-bottom:12px;
  transition: transform .15s ease, filter .15s ease;
}
.link-btn:hover{ transform: translateY(-1px); filter:brightness(1.05); }
.link-btn:active{ transform: translateY(0) scale(0.99); }
.btn-tg{ background: linear-gradient(135deg, var(--blue), var(--blue-deep)); }
.btn-drive{ background: linear-gradient(135deg, var(--red), var(--red-deep)); }
.link-icon{
  width:38px; height:38px; border-radius:11px; background:rgba(255,255,255,0.18);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.link-icon svg{ width:19px; height:19px; }
.link-text{ flex:1 1 auto; display:flex; flex-direction:column; gap:1px; }
.link-text .t1{ font-size:15px; font-weight:700; }
.link-text .t2{ font-size:11.5px; font-weight:500; opacity:0.85; }
.link-arrow{ width:16px; height:16px; flex:0 0 auto; opacity:0.85; }
.no-link{
  padding:14px 16px; border-radius:16px; background:#F6F7FA; color:#9AA1B0;
  font-size:13px; font-weight:500; text-align:center; margin-bottom:12px;
}
.footer-note{
  text-align:center; margin-top:20px; font-size:12px; color:#9AA1B0;
}
.footer-note b{ color:var(--ink); }
.back-link{
  display:block; text-align:center; margin-top:16px;
  font-size:12.5px; font-weight:600; color:var(--muted); text-decoration:none;
}
.back-link:hover{ color:var(--blue); }
</style>
</head>
